version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    class: app.core.logging.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  file_txt:
    class: app.core.logging.DailyRotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/app.log
    when: midnight
    backup_count: 15
    encoding: utf-8
  file_json:
    class: app.core.logging.DailyRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/app.json
    when: midnight
    backup_count: 15
    encoding: utf-8

loggers:
  app:
    level: DEBUG
    handlers: [console, file_txt, file_json]
    propagate: false
  app.services:
    level: DEBUG
    handlers: [console, file_txt, file_json]
    propagate: false
  app.routes:
    level: DEBUG
    handlers: [console, file_txt, file_json]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
