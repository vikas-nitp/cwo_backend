name: backend-ci
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_FRONTEND_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # Use the frontend branch with the same name when it exists, otherwise main.
      - name: Pick frontend ref
        if: env.HAS_FRONTEND_TOKEN == 'true'
        id: frontend_ref
        env:
          REPO: vikas-nitp/cardwiseoffer
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          set +e
          git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$BRANCH" >/dev/null
          code=$?
          set -e
          case "$code" in
            0) ref="$BRANCH" ;;
            2) ref=main; echo "::notice::No '$BRANCH' branch in $REPO; using main for the cross-repo check" ;;
            *) echo "::error::Could not query $REPO (git exit $code) - check FRONTEND_REPO_TOKEN"; exit 1 ;;
          esac
          echo "Using $REPO@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out frontend for contract sync
        if: env.HAS_FRONTEND_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: vikas-nitp/cardwiseoffer
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          ref: ${{ steps.frontend_ref.outputs.ref }}
          path: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_data_bundle.py
      - run: ruff format --check app scripts tests
      - run: ruff check app scripts tests
      - run: mypy app
      - run: python -m pytest
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json
      - run: python scripts/check_frontend_contract_sync.py
        env:
          CWO_FRONTEND_DIR: ${{ github.workspace }}/frontend
      - run: docker build -t cwo-backend:test .
