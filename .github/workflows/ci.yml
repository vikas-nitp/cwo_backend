name: backend-ci
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_offer_snapshot.py
      - run: git diff --exit-code -- data/generated
      - run: ruff format --check app scripts tests
      - run: ruff check app scripts tests
      - run: mypy app
      - run: python -m pytest
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json
      - run: python scripts/check_frontend_contract_sync.py
      - run: docker build -t cwo-backend:test .
